<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="outlineGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="metalBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Rectangular Cartouche / Chamfered Phone Frame -->
  <rect
    x="68"
    y="45"
    width="64"
    height="110"
    rx="18"
    stroke="url(#outlineGrad)"
    stroke-width="4.5"
    stroke-opacity="0.6"
    fill="none"
  />
  <rect
    x="74"
    y="51"
    width="52"
    height="98"
    rx="14"
    stroke="url(#chromeGrad)"
    stroke-width="1.5"
    stroke-opacity="0.4"
    fill="none"
  />

  <!-- Intertwined 'S' (Stark) -->
  <g filter="url(#metalBevel)">
    <path
      d="M 86 64 H 68 C 56 64 48 72 48 84 C 48 96 56 102 68 106 L 92 114 C 104 118 112 124 112 136 C 112 148 104 156 90 156 H 64 L 56 142 H 88 C 94 142 98 138 98 134 C 98 128 92 124 82 120 L 58 112 C 44 106 36 98 36 84 C 36 70 46 50 68 50 H 94 Z"
      fill="none"
      stroke="url(#chromeGrad)"
      stroke-width="5"
      stroke-linejoin="miter"
    />
    <path
      d="M 84 62 H 68 C 58 62 52 68 52 78 C 52 86 58 92 68 96 L 92 104 C 102 108 108 114 108 126 C 108 138 100 144 90 144 H 66"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="1.8"
      stroke-opacity="0.9"
    />
  </g>

  <!-- Intertwined 'F' (Focus) -->
  <g filter="url(#metalBevel)">
    <path
      d="M 104 50 H 162 L 156 64 H 118 V 92 H 150 L 144 106 H 118 V 156 H 104 Z"
      fill="none"
      stroke="url(#outlineGrad)"
      stroke-width="5"
      stroke-linejoin="miter"
    />
    <path
      d="M 107 54 H 158 M 115 62 V 152 M 115 95 H 146"
      fill="none"
      stroke="#BAE6FD"
      stroke-width="1.8"
      stroke-opacity="0.85"
    />
  </g>
</svg>
